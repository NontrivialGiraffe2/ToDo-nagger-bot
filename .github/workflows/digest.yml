name: todo-digest

on:
  schedule:
    # 15:00 UTC ~= 8:00 AM Pacific. Cron is always UTC, so this drifts by an
    # hour between PST and PDT — see the DST note in README.md.
    - cron: "0 15 * * 1-5"   # weekdays only (Mon-Fri)
  workflow_dispatch:          # lets you trigger it by hand to test

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python digest.py
        env:
          TODOIST_TOKEN: ${{ secrets.TODOIST_TOKEN }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
